# Configurações do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# O segredo estratégico: 'update' faz o Hibernate criar ou atualizar as tabelas na hora que o projeto liga
spring.jpa.hibernate.ddl-auto=update

# Mostra no console do IntelliJ o comando SQL real que o Java está executando (ótimo para aprender e debugar)
