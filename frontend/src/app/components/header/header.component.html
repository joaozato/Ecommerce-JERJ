<header class="topbar">
  <a class="brand" aria-label="Ir para a página inicial">
    <span class="brand-icon">
      <svg lucideSmile size="26" strokeWidth="2.5"></svg>
    </span>
    <span class="brand-name">{{ brandName }}</span>
  </a>

  <label class="search-bar" aria-label="Pesquisar produtos">
    <span class="search-icon">
      <svg lucideSearch size="20" strokeWidth="2.5"></svg>
    </span>
    <input type="search" placeholder="Pesquisar..." (input)="onSearchChange($any($event.target).value)" />
  </label>

  <button class="cart-button" type="button" aria-label="Abrir carrinho" (click)="cartClick.emit()">
    <svg lucideShoppingCart size="20" strokeWidth="2.4"></svg>
    <span>Carrinho</span>
    <strong>{{ cartItems }}</strong>
  </button>

  <app-menu />
</header>
