<aside class="cart-panel" *ngIf="isOpen" aria-label="Lista do carrinho">
  <header class="cart-panel-header">
    <div>
      <h2>Carrinho</h2>
      <span>{{ totalItems }} item{{ totalItems === 1 ? '' : 's' }}</span>
    </div>

    <button type="button" aria-label="Fechar carrinho" (click)="close()">X</button>
  </header>

  <p class="cart-empty" *ngIf="!items.length">Seu carrinho está vazio.</p>

  <div class="cart-items" *ngIf="items.length">
    <article class="cart-item" *ngFor="let item of items">
      <div>
        <h3>{{ item.produto.nome }}</h3>
        <p>{{ item.produto.marca }}</p>
        <strong>R$ {{ item.produto.preco | number:'1.2-2' }}</strong>
      </div>

      <div class="cart-item-actions">
        <span>Qtd. {{ item.quantidade }}</span>
        <button type="button" aria-label="Remover um item" (click)="remove(item.produto.id)">-</button>
      </div>
    </article>

    <footer class="cart-total">
      <span>Total</span>
      <strong>R$ {{ total | number:'1.2-2' }}</strong>
    </footer>
  </div>

  <button
    class="cart-buy-button"
    type="button"
    [disabled]="!items.length"
    (click)="buy()"
  >
    Comprar
  </button>
</aside>
