<button
  class="floating-menu"
  type="button"
  aria-label="Abrir menu"
  [style.top.px]="menuPosition.top"
  [style.right.px]="menuPosition.right"
  (pointerdown)="startDrag($event)"
  (pointermove)="dragMenu($event)"
  (pointerup)="endDrag($event)"
  (pointercancel)="endDrag($event)"
  (click)="toggleMenu($event)"
>
  <svg lucideMenu size="27" strokeWidth="2.5"></svg>
</button>

<div class="menu-backdrop" *ngIf="isOpen" (click)="closeMenu()"></div>

<aside
  class="menu-modal"
  *ngIf="isOpen"
  aria-label="Menu principal"
  [style.top.px]="menuPosition.top"
  [style.right.px]="menuPosition.right"
>
  <header class="menu-header">
    <button class="profile-button" type="button">
      <svg lucideUserRound size="23" strokeWidth="2.5"></svg>
      <span>Acessar perfil</span>
    </button>
  </header>

  <nav class="menu-content">
    <a href="#">Minhas compras</a>
    <a href="#">Mais vendidos no mês</a>

    <section class="categories" aria-labelledby="categories-title">
      <h2 id="categories-title">Categorias</h2>

      <div class="category-grid">
        <ul *ngFor="let group of categories">
          <li *ngFor="let category of group">
            <a [routerLink]="categoryRoute(category)" (click)="closeMenu()">{{ category }}</a>
          </li>
        </ul>
      </div>
    </section>
  </nav>
</aside>
